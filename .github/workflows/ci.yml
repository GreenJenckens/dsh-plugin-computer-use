name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      run_gui:
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit + packaging (no interactive desktop)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci.ps1 -Mode hosted
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-failure
          path: test-results
          retention-days: 7

  desktop:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gui }}
    runs-on: [self-hosted, windows, x64, dsh-gui]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Interactive desktop suite
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci.ps1 -Mode local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-results
          path: test-results
          retention-days: 7
